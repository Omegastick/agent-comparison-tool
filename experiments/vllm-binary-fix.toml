[experiment]
name = "vllm-binary-fix"
description = "Control task: fix a precisely-specified 32-bit integer-overflow bug in the moe_wna16 GEMM kernel."

[target]
repo = "https://github.com/vllm-project/vllm"
commit = "9036c89ee410b30913ca8b7d362a7d0805583b51"

[prompt]
text = """
You are working in the vLLM codebase.

There is an integer-overflow bug in the moe_wna16 GEMM kernel in `csrc/libtorch_stable/moe/moe_wna16.cu`.

When the kernel accumulates results into the output tensor, it computes the output element index as `token_index * size_n + offset_n` using 32-bit integer arithmetic. For large token counts this multiplication overflows, producing a wrong (and possibly negative) index, which then drives an out-of-bounds `atomicAdd` into the output buffer.

Fix the bug.
"""

[settings]
runs_per_agent = 3
parallel = true
timeout_minutes = 30

[providers.anthropic]
api_key = "$ANTHROPIC_API_KEY"

[providers.openai]
api_key = "$OPENAI_API_KEY"

[providers.zai]
base_url = "https://api.z.ai/api/paas/v4"
api_key = "$ZAI_API_KEY"

[[agents]]
id = "sonnet-4.6"
model = "anthropic/claude-sonnet-4-6"

[[agents]]
id = "opus-4.8"
model = "anthropic/claude-opus-4-8"

[[agents]]
id = "gpt-5.4"
model = "openai/gpt-5.4"

[[agents]]
id = "glm-5.2"
model = "zai/glm-5.2"
