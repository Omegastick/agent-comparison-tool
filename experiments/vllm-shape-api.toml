[experiment]
name = "vllm-shape-api"
description = "Judgment task: design an API to expose per-request timing back to the caller, where the delivery mechanism is an open design choice."

[target]
repo = "https://github.com/vllm-project/vllm"
commit = "9036c89ee410b30913ca8b7d362a7d0805583b51"

[prompt]
text = """
You are working in the vLLM codebase.

Our users want to understand the latency breakdown of their own individual requests to this inference server: how long their request spent queued before it started, how long prefill took, how long decode took, and the inter-token latency they experienced. The server already measures timing like this internally, but today it is only exposed in aggregate, through Prometheus metrics and OTel traces. That is no help to an end caller who simply wants the numbers for the one request they just made.

Design the API for exposing per-request timing back to the caller. Work out what timings can and should be surfaced, how a caller would opt in, and how this fits requests served both with and without streaming. How the timing is actually delivered back to the caller is an open design question with no settled answer: decide on an approach and justify it.

Record the design the way the team does: as a Markdown design doc at docs/design/per-request-timing.md. Use the team's standard design-doc template:

- Title and summary
- Background: the problem and the current behavior
- Proposed design: the API, the timings surfaced, and how a caller opts in
- Streaming and non-streaming: how it works for each
- Alternatives considered: the other delivery mechanisms you weighed, and why you chose this one
- Open questions: anything left unresolved
"""

[settings]
runs_per_agent = 3
parallel = true
timeout_minutes = 30

[providers.anthropic]
api_key = "$ANTHROPIC_API_KEY"

[providers.openai]
api_key = "$OPENAI_API_KEY"

[providers.zai]
base_url = "https://api.z.ai/api/paas/v4"
api_key = "$ZAI_API_KEY"

[[agents]]
id = "sonnet-4.6"
model = "anthropic/claude-sonnet-4-6"

[[agents]]
id = "opus-4.8"
model = "anthropic/claude-opus-4-8"

[[agents]]
id = "gpt-5.4"
model = "openai/gpt-5.4"

[[agents]]
id = "glm-5.2"
model = "zai/glm-5.2"
